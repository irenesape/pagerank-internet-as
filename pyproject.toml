[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pagerank-internet-as"
version = "0.1.0"
description = "PageRank on the AS-level Internet topology (CAIDA AS Relationships)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Irene Sarrias Perez" }]
keywords = ["pagerank", "power-iteration", "sparse-matrices", "internet-topology", "bgp"]

# Reference interpreter for the project is CPython 3.11 (see README).
# The exact patch version used to produce the results is recorded in the
# header of requirements-lock.txt.
requires-python = ">=3.11"

# Runtime dependencies of the *library* in src/pagerank.
# Deliberately declared as ranges, not exact pins: a library states what it
# is compatible with, an environment states what was actually installed.
# Bounds are set at major-version boundaries, which is where these projects
# allow themselves to break compatibility. The numpy floor is 2.0 on purpose:
# spanning the 1.x/2.x boundary would mean supporting two incompatible APIs
# (removed scalar aliases, changed copy semantics, NEP 50 promotion rules) for
# no benefit. The tight upper bound is supplied transitively by scipy, which
# currently declares numpy<2.7, so repeating it here would only go stale.
dependencies = [
    "numpy>=2.0,<3.0",
    "scipy>=1.11,<2.0",
    "pandas>=2.1,<3.0",
    "matplotlib>=3.8,<4.0",
]

[project.optional-dependencies]
# Not needed to import the library, only to develop/run the analysis.
# networkx lives here on purpose: it is used ONLY to cross-check results on
# small graphs, never to compute the results reported in the notebooks.
dev = [
    "pytest>=8.0,<9.0",
    "jupyter>=1.0,<2.0",
    "networkx>=3.2,<4.0",
]

[project.urls]
Repository = "https://github.com/irenesape/pagerank-internet-as"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
